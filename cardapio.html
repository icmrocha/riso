<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cardápio — Riso</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(0,0,0,.85);
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
    }
    header a:hover { text-decoration: underline; }
    #status {
      padding: 16px;
      text-align: center;
      color: #bbb;
      font-size: .9rem;
    }
    #viewer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 8px 8px 32px;
    }
    #viewer canvas {
      width: 100%;
      max-width: 900px;
      height: auto;
      background: #fff;
      box-shadow: 0 4px 24px rgba(0,0,0,.4);
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← Riso</a>
    <a href="cardapio.pdf" target="_blank" rel="noopener">Baixar PDF</a>
  </header>
  <div id="status">Carregando cardápio…</div>
  <div id="viewer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // PDF.js desenha o arquivo na página. Você só troca o cardapio.pdf.
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const statusEl = document.getElementById("status");
    const viewer = document.getElementById("viewer");

    pdfjsLib.getDocument("cardapio.pdf").promise
      .then(function (pdf) {
        statusEl.textContent = "";
        const tarefas = [];
        for (let n = 1; n <= pdf.numPages; n++) {
          tarefas.push(
            pdf.getPage(n).then(function (page) {
              const escalaBase = 1.5;
              const viewport = page.getViewport({ scale: escalaBase });
              const canvas = document.createElement("canvas");
              const ctx = canvas.getContext("2d");
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              viewer.appendChild(canvas);
              return page.render({ canvasContext: ctx, viewport: viewport }).promise;
            })
          );
        }
        return Promise.all(tarefas);
      })
      .catch(function () {
        statusEl.innerHTML = 'Não deu para abrir o cardápio aqui. <a href="cardapio.pdf" style="color:#fff">Baixar o PDF</a>.';
      });
  </script>
</body>
</html>
