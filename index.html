<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RISO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      width: 100vw;
      font-family: 'Helvetica Neue', sans-serif;
      display: flex;
      justify-content: center; 
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Imagem de fundo com desfoque */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-image: url('agora-borogodo-riso_websize.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(4px);
      transform: scale(1.05);
    }

    .fade-in {
      opacity: 0;
      animation: fadeIn 1s ease-in-out forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* Bloco de links centralizado */
    .links-container {
      font-size: 0.9rem;
      color: #ffffff;
      background-color: rgba(0, 0, 0, 0.2);
      padding: 10px 20px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    .links-container a {
      color: #ffffff;
      text-decoration: none;
      margin: 0 10px;
    }

    .links-container a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Links centralizados no meio da tela -->
  <div class="links-container fade-in">
    <a href="https://instagram.com/casa.riso" target="_blank">Instagram</a> |
    <a href="https://wa.me/5524992438242" target="_blank">Reservas</a> |
    <a href="cardapio.pdf" target="_blank">Cardápio</a>
  </div>

</body>
</html>
