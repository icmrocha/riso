<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RISO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      width: 100vw;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center; 
      align-items: center;
      overflow: hidden;
      position: relative;
      background-color: #000;
    }

    /* Camadas para o efeito de transição ultra suave de fundo */
    .bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      z-index: -1;
      
      /* Transição de fusão gradual de 2 segundos */
      transition: opacity 2s ease-in-out; 
      opacity: 0;
    }

    .bg-layer.active {
      opacity: 1;
    }

    .fade-in {
      opacity: 0;
      animation: fadeIn 1s ease-in-out forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

       /* Container de links centralizado */
    .links-container {
      font-size: 1.25rem;
      font-weight: 500;
      color: #ffffff;
      background-color: rgba(0, 0, 0, 0.35);
      padding: 14px 28px;
      border-radius: 30px;
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    .links-container a {
      color: #ffffff;
      text-decoration: none;
      margin: 0 12px;
      transition: opacity 0.2s ease;
    }

    .links-container a:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .links-container {
        font-size: 1rem;
        padding: 10px 18px;
      }
      .links-container a {
        margin: 0 6px;
      }
    }
  </style>
</head>
<body>

  <!-- As duas camadas de fundo sobrepostas -->
  <div id="bg1" class="bg-layer active"></div>
  <div id="bg2" class="bg-layer"></div>

  

  <!-- Links do site -->
  <div class="links-container fade-in">
    <a href="https://instagram.com/casa.riso" target="_blank">Instagram</a> |
    <a href="https://riso.art.br/res_index.html" target="_blank">Reservas</a> |
    <a href="cardapio.pdf" target="_blank">Cardápio</a>
  </div>


  <script>
    // Configurações de enquadramento e zoom aprovadas
    const imagensConfig = [
      { src: 'agora-borogodo-riso_websize.jpg', position: '50% 50%', size: 'cover' },
      { src: 'RISO-thewonder-13_websize.jpg', position: '68% 61%', size: '109%' },
      { src: 'RISO-thewonder-40_websize.jpg', position: '89% 42%', size: '102%' },
      { src: 'RISO-thewonder-57_websize.jpg', position: '50% 49%', size: 'cover' },
      { src: 'RISO-thewonder-131_websize.jpg', position: '53% 65%', size: 'cover' }
    ];

    let indiceAtual = 0;
    let camadaAtiva = 1;

    const bg1 = document.getElementById('bg1');
    const bg2 = document.getElementById('bg2');

    // Aplica imagem, posição e zoom na camada especificada
    function aplicarEstilosFundo(camada, config) {
      camada.style.backgroundImage = `url('${config.src}')`;
      camada.style.backgroundPosition = config.position;
      camada.style.backgroundSize = config.size;
    }

    // Carrega a primeira imagem imediatamente ao abrir o site
    aplicarEstilosFundo(bg1, imagensConfig[0]);

    function trocarFundoSuave() {
      indiceAtual = (indiceAtual + 1) % imagensConfig.length;
      const proximaConfig = imagensConfig[indiceAtual];

      if (camadaAtiva === 1) {
        aplicarEstilosFundo(bg2, proximaConfig);
        bg2.classList.add('active');
        bg1.classList.remove('active');
        camadaAtiva = 2;
      } else {
        aplicarEstilosFundo(bg1, proximaConfig);
        bg1.classList.add('active');
        bg2.classList.remove('active');
        camadaAtiva = 1;
      }
    }

    // Intervalo de 3.5 segundos para a troca de imagens
    setInterval(trocarFundoSuave, 3500);
  </script>

</body>
</html>
