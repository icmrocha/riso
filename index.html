<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RISO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      width: 100vw;
      font-family: 'Helvetica Neue', sans-serif;
      display: flex;
      justify-content: center; 
      align-items: center;
      overflow: hidden;
      
      /* Fundo original sem desfoque */
      background-image: url('agora-borogodo-riso_websize.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .fade-in {
      opacity: 0;
      animation: fadeIn 1s ease-in-out forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* Container de links maior e centralizado */
    .links-container {
      font-size: 1.25rem; /* Aumentado o tamanho da fonte */
      font-weight: 500;
      color: #ffffff;
      background-color: rgba(0, 0, 0, 0.35); /* Leve fundo escuro para garantir leitura */
      padding: 14px 28px;
      border-radius: 30px;
      backdrop-filter: blur(4px); /* Suave desfoque apenas no balão dos links */
    }

    .links-container a {
      color: #ffffff;
      text-decoration: none;
      margin: 0 12px;
      transition: opacity 0.2s ease;
    }

    .links-container a:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    /* Ajuste para telas pequenas (celulares) */
    @media (max-width: 600px) {
      .links-container {
        font-size: 1rem;
        padding: 10px 18px;
      }
      .links-container a {
        margin: 0 6px;
      }
    }
  </style>
</head>
<body>

  <div class="links-container fade-in">
    <a href="https://instagram.com/casa.riso" target="_blank">Instagram</a> |
    <a href="https://wa.me/5524992438242" target="_blank">Reservas</a> |
    <a href="cardapio.pdf" target="_blank">Cardápio</a>
  </div>

</body>
</html>
