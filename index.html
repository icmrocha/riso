<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RISO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      width: 100vw;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center; 
      align-items: center;
      overflow: hidden;
      position: relative;
      background-color: #000;
    }

    /* Camadas para o efeito de transição ultra suave de fundo */
    .bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      z-index: -1;
      
      /* Transição de fusão gradual de 2 segundos */
      transition: opacity 2s ease-in-out; 
      opacity: 0;
    }

    .bg-layer.active {
      opacity: 1;
    }

    .fade-in {
      opacity: 0;
      animation: fadeIn 1s ease-in-out forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* Container de links centralizado */
    .links-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 90%;
      max-width: 380px;
      padding: 24px 20px;
      background-color: rgba(0, 0, 0, 0.45);
      border-radius: 24px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* BOTÃO PRINCIPAL DE RESERVAS (DESTAQUE VISUAL) */
    .btn-main-reserva {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 20px;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease-in-out;
    }

    .btn-main-reserva:hover, .btn-main-reserva:active {
      background-color: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.5);
    }

    .btn-main-reserva .title {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .btn-main-reserva .subtitle {
      font-size: 0.78rem;
      font-weight: 400;
      opacity: 0.9;
      margin-top: 2px;
    }

    /* BOTÕES SECUNDÁRIOS HARMONIZADOS (INSTAGRAM E CARDÁPIO) */
    .secondary-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .btn-secondary {
      flex: 1;
      text-align: center;
      padding: 10px 14px;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.4);
    }

    @media (max-width: 480px) {
      .links-container {
        padding: 20px 16px;
      }
      .btn-main-reserva .title {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <!-- As duas camadas de fundo sobrepostas -->
  <div id="bg1" class="bg-layer active"></div>
  <div id="bg2" class="bg-layer"></div>

  <!-- Container de Links Centralizado -->
  <div class="links-container fade-in">
    
    <!-- Novo Botão Principal de Reserva (Destaque Visual) -->
    <a href="https://riso.art.br/res_index.html" class="btn-main-reserva">
      <span class="title">Faça Sua Reserva</span>
      <span class="subtitle">de maneira prática online</span>
    </a>

    <!-- Botões Secundários Reorganizados -->
    <div class="secondary-links">
      <a href="https://instagram.com/casa.riso" target="_blank" class="btn-secondary">Instagram</a>
      <a href="cardapio.pdf" target="_blank" class="btn-secondary">Cardápio</a>
    </div>

  </div>

  <script>
    // Configurações de enquadramento e zoom aprovadas
    const imagensConfig = [
      { src: 'agora-borogodo-riso_websize.jpg', position: '50% 50%', size: 'cover' },
      { src: 'RISO-thewonder-13_websize.jpg', position: '68% 61%', size: '109%' },
      { src: 'RISO-thewonder-40_websize.jpg', position: '89% 42%', size: '102%' },
      { src: 'RISO-thewonder-57_websize.jpg', position: '50% 49%', size: 'cover' },
      { src: 'RISO-thewonder-131_websize.jpg', position: '53% 65%', size: 'cover' }
    ];

    let indiceAtual = 0;
    let camadaAtiva = 1;

    const bg1 = document.getElementById('bg1');
    const bg2 = document.getElementById('bg2');

    // Aplica imagem, posição e zoom na camada especificada
    function aplicarEstilosFundo(camada, config) {
      camada.style.backgroundImage = `url('${config.src}')`;
      camada.style.backgroundPosition = config.position;
      camada.style.backgroundSize = config.size;
    }

    // Carrega a primeira imagem imediatamente ao abrir o site
    aplicarEstilosFundo(bg1, imagensConfig[0]);

    function trocarFundoSuave() {
      indiceAtual = (indiceAtual + 1) % imagensConfig.length;
      const proximaConfig = imagensConfig[indiceAtual];

      if (camadaAtiva === 1) {
        aplicarEstilosFundo(bg2, proximaConfig);
        bg2.classList.add('active');
        bg1.classList.remove('active');
        camadaAtiva = 2;
      } else {
        aplicarEstilosFundo(bg1, proximaConfig);
        bg1.classList.add('active');
        bg2.classList.remove('active');
        camadaAtiva = 1;
      }
    }

    // Intervalo de 3.5 segundos para a troca de imagens
    setInterval(trocarFundoSuave, 3500);
  </script>

</body>
</html>
