<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RISO - Testador de Imagens</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      width: 100vw;
      font-family: 'Helvetica Neue', sans-serif;
      display: flex;
      justify-content: center; 
      align-items: center;
      overflow: hidden;
      position: relative;
      background-color: #000;
    }

    .bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center center; 
      background-repeat: no-repeat;
      z-index: -1;
      transition: opacity 1s ease-in-out; 
      opacity: 0;
    }

    .bg-layer.active {
      opacity: 1;
    }

    .links-container {
      font-size: 1.25rem;
      font-weight: 500;
      color: #ffffff;
      background-color: rgba(0, 0, 0, 0.35);
      padding: 14px 28px;
      border-radius: 30px;
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    .links-container a {
      color: #ffffff;
      text-decoration: none;
      margin: 0 12px;
    }

    /* PAINEL DE TESTES FIXO */
    #test-panel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 15px;
      border-radius: 12px;
      z-index: 9999;
      font-family: monospace;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #test-panel select, #test-panel input {
      width: 100%;
    }

    #test-panel button {
      cursor: pointer;
      padding: 5px;
      background: #fff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="bg1" class="bg-layer active"></div>

  <div class="links-container">
    <a href="https://instagram.com/casa.riso" target="_blank">Instagram</a> |
    <a href="https://wa.me/5524992438242" target="_blank">Reservas</a> |
    <a href="cardapio.pdf" target="_blank">Cardápio</a>
  </div>

  <!-- CONTROLES VISUAIS NA TELA -->
  <div id="test-panel">
    <strong>PAINEL DE AJUSTE DE POSIÇÃO</strong>
    
    <label>Escolha a imagem:</label>
    <select id="select-img" onchange="carregarImagemTeste()">
      <option value="agora-borogodo-riso_websize.jpg">agora-borogodo-riso</option>
      <option value="RISO-thewonder-13_websize.jpg">RISO-thewonder-13</option>
      <option value="RISO-thewonder-40_websize.jpg">RISO-thewonder-40</option>
      <option value="RISO-thewonder-57_websize.jpg">RISO-thewonder-57</option>
      <option value="RISO-thewonder-131_websize.jpg">RISO-thewonder-131</option>
      <option value="RISO-thewonder-109_websize.jpg">RISO-thewonder-109</option>
    </select>

    <label>Posição Vertical (Y): <span id="val-y">50%</span></label>
    <input type="range" id="range-y" min="0" max="100" value="50" oninput="atualizarPosicao()">

    <label>Posição Horizontal (X): <span id="val-x">50%</span></label>
    <input type="range" id="range-x" min="0" max="100" value="50" oninput="atualizarPosicao()">

    <button onclick="copiarCodigo()">Copiar Valor Gerado</button>
  </div>

  <script>
    const bg = document.getElementById('bg1');
    const select = document.getElementById('select-img');
    const rangeY = document.getElementById('range-y');
    const rangeX = document.getElementById('range-x');
    const valY = document.getElementById('val-y');
    const valX = document.getElementById('val-x');

    function carregarImagemTeste() {
      bg.style.backgroundImage = `url('${select.value}')`;
      atualizarPosicao();
    }

    function atualizarPosicao() {
      const pos = `${rangeX.value}% ${rangeY.value}%`;
      bg.style.backgroundPosition = pos;
      valX.innerText = `${rangeX.value}%`;
      valY.innerText = `${rangeY.value}%`;
    }

    function copiarCodigo() {
      const texto = `{ src: '${select.value}', position: '${rangeX.value}% ${rangeY.value}%' }`;
      navigator.clipboard.writeText(texto);
      alert(`Copiado para a área de transferência:\n${texto}`);
    }

    // Inicializa com a primeira imagem
    carregarImagemTeste();
  </script>

</body>
</html>
