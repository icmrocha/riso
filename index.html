<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RISO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      width: 100vw;
      font-family: 'Helvetica Neue', sans-serif;
      display: flex;
      justify-content: center; 
      align-items: center;
      overflow: hidden;
      
      /* Transição suave ao trocar a imagem */
      transition: background-image 1s ease-in-out;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .fade-in {
      opacity: 0;
      animation: fadeIn 1s ease-in-out forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* Container de links centralizado */
    .links-container {
      font-size: 1.25rem;
      font-weight: 500;
      color: #ffffff;
      background-color: rgba(0, 0, 0, 0.35);
      padding: 14px 28px;
      border-radius: 30px;
      backdrop-filter: blur(4px);
    }

    .links-container a {
      color: #ffffff;
      text-decoration: none;
      margin: 0 12px;
      transition: opacity 0.2s ease;
    }

    .links-container a:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .links-container {
        font-size: 1rem;
        padding: 10px 18px;
      }
      .links-container a {
        margin: 0 6px;
      }
    }
  </style>
</head>
<body>

  <div class="links-container fade-in">
    <a href="https://instagram.com/casa.riso" target="_blank">Instagram</a> |
    <a href="https://wa.me/5524992438242" target="_blank">Reservas</a> |
    <a href="cardapio.pdf" target="_blank">Cardápio</a>
  </div>

  <script>
    // Lista com os nomes dos seus arquivos de imagem
    const imagens = [
      'agora-borogodo-riso_websize.jpg',
      'RISO-thewonder-13_websize.jpg',
      'RISO-thewonder-40_websize.jpg',
      'RISO-thewonder-57_websize.jpg',
      'RISO-thewonder-131_websize.jpg',
      'RISO-thewonder-109_websize.jpg'


      
    ];

    let indiceAtual = 0;

    function trocarFundo() {
      // Atualiza a imagem de fundo do body
      document.body.style.backgroundImage = `url('${imagens[indiceAtual]}')`;
      
      // Avança para a próxima imagem ou volta para a primeira
      indiceAtual = (indiceAtual + 1) % imagens.length;
    }

    // Carrega a primeira imagem imediatamente ao abrir
    trocarFundo();

    // Define o tempo de troca em milissegundos (5000ms = 5 segundos)
    setInterval(trocarFundo, 5000);
  </script>

</body>
</html>
