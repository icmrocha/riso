<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RISO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      width: 100vw;
      font-family: 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 20px;
      overflow: hidden;
      
      /* Configuração do fundo */
      background-image: url('agora-borogodo-riso_websize.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .fade-in {
      opacity: 0;
      animation: fadeIn 1s ease-in-out forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* Título principal centralizado */
    h1.title {
      font-size: 8rem;
      font-weight: 300;
      color: #ffffff;
      letter-spacing: 2px;
      margin: auto 0;
      text-transform: uppercase;
    }

    footer {
      font-size: 0.9rem;
      color: #ffffff;
      background-color: rgba(0, 0, 0, 0.2);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    footer a {
      color: #ffffff;
      text-decoration: none;
      margin: 0 10px;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Ajuste para telas menores (Celulares) */
    @media (max-width: 600px) {
      h1.title {
        font-size: 4rem;
      }
    }
  </style>
</head>
<body>

  <!-- Título RISO estilo marca d'água/hero -->
  <h1 class="title fade-in">RISO</h1>

  <!-- Rodapé com os links -->
  <footer class="fade-in" style="animation-delay: 0.5s;">
    <a href="https://instagram.com/casa.riso" target="_blank">Instagram</a> |
    <a href="https://wa.me/5524992438242" target="_blank">Reservas</a> |
    <a href="cardapio.pdf" target="_blank">Cardápio</a>
  </footer>

</body>
</html>
